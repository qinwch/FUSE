model:
  posterior_kwargs:
    hidden_dim: 256
    depth: 4
    heads: 4
    context_num_tokens: 4
    theta_num_tokens: 2
    is_individual: true
    time_prior_exponent: 4
    sigma_min: 0.0001
    type: mmdit
  type: flow_matching
task:
  name: two_moons
  # Other options: bernoulli_glm, bernoulli_glm_raw, gaussian_linear, gaussian_linear_uniform, gaussian_mixture, lotka_volterra, sir, slcp, slcp_distractors
  num_train_samples: 100000
training:
  device: cuda
  batch_size: 64
  early_stopping: true
  epochs: 200
  num_workers: 0
  optimizer:
    lr: 0.0002
    type: adam
  scheduler:
    factor: 0.2
    patience: 1
    type: reduce_on_plateau
  train_fraction: 0.95
